name: se-smart-pulsa

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: pulsa
      POSTGRES_PASSWORD: pulsa_dev_only
      POSTGRES_DB: pulsa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsa -d pulsa"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  # One-shot schema + seed, runs before the API starts. Idempotent.
  migrate:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && node src/setup-db.js"]
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://pulsa:pulsa_dev_only@db:5432/pulsa
    depends_on:
      db:
        condition: service_healthy

  api:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node --watch src/server.js"]
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://pulsa:pulsa_dev_only@db:5432/pulsa
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 401 from the auth-guarded endpoint still proves the API is answering.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/api/v1/me').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      VITE_API_PROXY: http://api:8000
      # Injected by the Base44 sandbox; bare keys pass them through when present.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      BASE44_PREVIEW_MODE:
      BASE44_SANDBOX_HOST_DOMAIN:
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    labels:
      base44.project: "SE-SMART PULSA"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
