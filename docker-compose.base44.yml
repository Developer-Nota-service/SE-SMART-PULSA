name: se-smart-pulsa

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: pulsa
      POSTGRES_PASSWORD: pulsa_dev_only
      POSTGRES_DB: pulsa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsa -d pulsa"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    labels:
      base44.project: "SE-SMART PULSA"
      base44.kind: "infra"

  # One-shot: pastikan database khusus Laravel ada (data lama milik backend
  # Node sebelumnya tidak disentuh).
  dbsetup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: pulsa_dev_only
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        psql -h db -U pulsa -d pulsa -tAc "SELECT 1 FROM pg_database WHERE datname='pulsa_laravel'" | grep -q 1 \
          || psql -h db -U pulsa -d pulsa -c 'CREATE DATABASE pulsa_laravel'

  # Laravel: API /api/v1 + halaman /app. Migrasi + seed dijalankan saat start
  # (keduanya idempotent), jadi db kosong selalu siap dipakai.
  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: on-failure
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist
        php artisan config:clear >/dev/null
        php artisan migrate --force
        php artisan db:seed --force
        exec php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: base64:lOZh+tWXYdiU7ZRfijeTwOqveUUVjd6HDaWs+MDJZag=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: pulsa_laravel
      DB_USERNAME: pulsa
      DB_PASSWORD: pulsa_dev_only
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
      dbsetup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "docker/health.php"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    labels:
      base44.project: "SE-SMART PULSA"
      base44.kind: "api"
      base44.port: "8000"

  web:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Semua /api diproxy ke Laravel (single origin, cookie sesi tetap terkirim).
      VITE_API_PROXY: http://laravel:8000
      # Injected by the Base44 sandbox; bare keys pass them through when present.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      BASE44_PREVIEW_MODE:
      BASE44_SANDBOX_HOST_DOMAIN:
    depends_on:
      laravel:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    labels:
      base44.project: "SE-SMART PULSA"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  pgdata:
  web_node_modules:
