[program:se-smart-pulsa-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/se-smart-pulsa
command=/usr/bin/php /var/www/se-smart-pulsa/artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=100
redirect_stderr=true
stdout_logfile=/var/www/se-smart-pulsa/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
